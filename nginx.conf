events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 4096;

        # Open WebUI (/webui and /webui/)
        location /webui/ {
            proxy_pass http://127.0.0.1:8098/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /webui {
            return 301 /webui/;
        }

        # Open WebUI Frontend Static Assets & Modules
        location /_app/ {
            proxy_pass http://127.0.0.1:8098/_app/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /static/ {
            proxy_pass http://127.0.0.1:8098/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /manifest.json {
            proxy_pass http://127.0.0.1:8098/manifest.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /favicon.png {
            proxy_pass http://127.0.0.1:8098/favicon.png;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /splash.png {
            proxy_pass http://127.0.0.1:8098/splash.png;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /splash-dark.png {
            proxy_pass http://127.0.0.1:8098/splash-dark.png;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Open WebUI API routes
        location /api/ {
            proxy_pass http://127.0.0.1:8098/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Jellyfin Media Server (/Jellyfin and /jellyfin)
        location /Jellyfin/ {
            proxy_pass http://127.0.0.1:8096/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /Jellyfin {
            return 301 /Jellyfin/;
        }

        location /jellyfin/ {
            proxy_pass http://127.0.0.1:8096/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /jellyfin {
            return 301 /jellyfin/;
        }

        # Telegram Direct Range Stream Proxy
        location /tg-stream/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # OpenCode API & WebSocket Routes (for OpenCode Mobile App & CLI)
        location /session {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /project {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /config {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /events {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /ws {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # OmniRoute Web Dashboard & API (Default for Web Browser UI & Assets)
        location / {
            proxy_pass http://127.0.0.1:20128;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
