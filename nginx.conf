events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    port_in_redirect off;
    server_name_in_redirect off;

    server {
        listen 4096;
        server_name _;

        # Global Proxy Headers (Strip internal port 4096)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host "jishnupg-opencode-cli.hf.space";
        proxy_set_header X-Forwarded-Host "jishnupg-opencode-cli.hf.space";
        proxy_set_header X-Forwarded-Port "443";
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Strip :4096 from any location headers returned by any backend
        proxy_redirect ~^https?://[^/]+:4096/(.*)$ https://jishnupg-opencode-cli.hf.space/$1;
        proxy_redirect ~^http://jishnupg-opencode-cli\.hf\.space/(.*)$ https://jishnupg-opencode-cli.hf.space/$1;

        # ----------------------------------------------------
        # 1. OMNIROUTE GATEWAY (/omniroute, /login, /dashboard)
        # ----------------------------------------------------
        location /omniroute/ {
            proxy_pass http://127.0.0.1:20128/;
        }

        location = /omniroute {
            return 301 /omniroute/;
        }

        location /login {
            proxy_pass http://127.0.0.1:20128/login;
        }

        location /dashboard {
            proxy_pass http://127.0.0.1:20128/dashboard;
        }

        location /models {
            proxy_pass http://127.0.0.1:20128/models;
        }

        location /omniroute/assets/ {
            proxy_pass http://127.0.0.1:20128/assets/;
        }

        location /v1/ {
            proxy_pass http://127.0.0.1:20128/v1/;
        }

        # ----------------------------------------------------
        # 2. OPEN WEBUI (/openwebui, /webui, /auth)
        # ----------------------------------------------------
        location /openwebui/ {
            proxy_pass http://127.0.0.1:8098/;
        }

        location = /openwebui {
            return 301 /openwebui/;
        }

        location /webui/ {
            proxy_pass http://127.0.0.1:8098/;
        }

        location = /webui {
            return 301 /webui/;
        }

        location /auth {
            proxy_pass http://127.0.0.1:8098/auth;
        }

        # ----------------------------------------------------
        # 3. OPENCODE SERVER (/server, /session, /project, /ws)
        # ----------------------------------------------------
        location /server/ {
            proxy_pass http://127.0.0.1:4097/;
        }

        location = /server {
            return 301 /server/;
        }

        location /session {
            proxy_pass http://127.0.0.1:4097;
        }

        location /project {
            proxy_pass http://127.0.0.1:4097;
        }

        location /config {
            proxy_pass http://127.0.0.1:4097;
        }

        location /events {
            proxy_pass http://127.0.0.1:4097;
        }

        location /ws {
            proxy_pass http://127.0.0.1:4097;
        }

        # ----------------------------------------------------
        # 4. JELLYFIN MEDIA SERVER (/jellyfin and /Jellyfin)
        # ----------------------------------------------------
        location /jellyfin/ {
            proxy_pass http://127.0.0.1:8096/;
        }

        location = /jellyfin {
            return 301 /jellyfin/;
        }

        location /Jellyfin/ {
            proxy_pass http://127.0.0.1:8096/;
        }

        location = /Jellyfin {
            return 301 /Jellyfin/;
        }

        # ----------------------------------------------------
        # 5. TELEGRAM STREAM PROXY (/tg-stream)
        # ----------------------------------------------------
        location /tg-stream/ {
            proxy_pass http://127.0.0.1:8080/;
        }

        # ----------------------------------------------------
        # 6. DEFAULT ROOT ROUTE (Open WebUI at /)
        # ----------------------------------------------------
        location / {
            proxy_pass http://127.0.0.1:8098;
        }
    }
}
