events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    port_in_redirect off;
    server_name_in_redirect off;

    server {
        listen 4096;
        server_name _;

        # Global Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host "jishnupg-opencode-cli.hf.space";
        proxy_set_header X-Forwarded-Port "443";

        # Strip internal port 4096 from Location headers
        proxy_redirect ~^https?://[^/]+:4096/(.*)$ https://jishnupg-opencode-cli.hf.space/$1;

        # -------------------------------------------------------
        # 1. JELLYFIN MEDIA SERVER (/jellyfin)
        # -------------------------------------------------------
        location /jellyfin/ {
            proxy_pass http://127.0.0.1:8096/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Prefix /jellyfin;
        }

        location = /jellyfin {
            return 301 /jellyfin/;
        }

        # -------------------------------------------------------
        # 4. TELEGRAM STREAM PROXY (/tg-stream)
        # -------------------------------------------------------
        location /tg-stream/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_buffering off;
        }

        # -------------------------------------------------------
        # 5. OPEN WEBUI (/ - Root application & API)
        # -------------------------------------------------------
        location /api/ {
            proxy_pass http://127.0.0.1:8098/api/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /auth/ {
            proxy_pass http://127.0.0.1:8098/auth/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /_app/ {
            proxy_pass http://127.0.0.1:8098/_app/;
        }

        location /static/ {
            proxy_pass http://127.0.0.1:8098/static/;
        }

        location / {
            proxy_pass http://127.0.0.1:8098/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
