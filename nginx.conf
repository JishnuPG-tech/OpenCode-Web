events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    port_in_redirect off;
    server_name_in_redirect off;

    server {
        listen 4096;
        server_name _;

        # Global Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host "jishnupg-opencode-cli.hf.space";
        proxy_set_header X-Forwarded-Port "443";

        # Strip internal port 4096 from Location headers
        proxy_redirect ~^https?://[^/]+:4096/(.*)$ https://jishnupg-opencode-cli.hf.space/$1;

        # -------------------------------------------------------
        # 1. OMNIROUTE AI GATEWAY (/omniroute, /v1, /_next, /assets)
        # -------------------------------------------------------
        location /omniroute/ {
            proxy_pass http://127.0.0.1:20128/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect /login /omniroute/login;
            proxy_redirect /dashboard /omniroute/dashboard;
            proxy_set_header Accept-Encoding "";
            sub_filter_types text/javascript application/javascript application/json;
            sub_filter 'href="/' 'href="/omniroute/';
            sub_filter 'src="/' 'src="/omniroute/';
            sub_filter 'action="/' 'action="/omniroute/';
            sub_filter '="/_next/' '="/omniroute/_next/';
            sub_filter '"/_next/' '"/omniroute/_next/';
            sub_filter '="/assets/' '="/assets/';
            sub_filter_once off;
        }

        location = /omniroute {
            return 301 /omniroute/;
        }

        location /_next/ {
            proxy_pass http://127.0.0.1:20128/_next/;
        }

        location /assets/ {
            proxy_pass http://127.0.0.1:20128/assets/;
        }

        location /v1/ {
            proxy_pass http://127.0.0.1:20128/v1/;
        }

        # -------------------------------------------------------
        # 2. OPENCODE CLI SERVER (/server, /session, /project, etc.)
        # -------------------------------------------------------
        location /server/ {
            proxy_pass http://127.0.0.1:4097/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Accept-Encoding "";
            sub_filter_types text/javascript application/javascript;
            sub_filter 'href="/' 'href="/server/';
            sub_filter 'src="/' 'src="/server/';
            sub_filter_once off;
        }

        location = /server {
            return 301 /server/;
        }

        location /session    { proxy_pass http://127.0.0.1:4097; }
        location /project    { proxy_pass http://127.0.0.1:4097; }
        location /config     { proxy_pass http://127.0.0.1:4097; }
        location /permission { proxy_pass http://127.0.0.1:4097; }
        location /question   { proxy_pass http://127.0.0.1:4097; }
        location /file       { proxy_pass http://127.0.0.1:4097; }
        location /find       { proxy_pass http://127.0.0.1:4097; }
        location /events     { proxy_pass http://127.0.0.1:4097; proxy_buffering off; }
        location /event      { proxy_pass http://127.0.0.1:4097; proxy_buffering off; }

        location /ws {
            proxy_pass http://127.0.0.1:4097;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # -------------------------------------------------------
        # 3. JELLYFIN MEDIA SERVER (/jellyfin)
        # -------------------------------------------------------
        location /jellyfin/ {
            proxy_pass http://127.0.0.1:8096/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Prefix /jellyfin;
        }

        location = /jellyfin {
            return 301 /jellyfin/;
        }

        # -------------------------------------------------------
        # 4. TELEGRAM STREAM PROXY (/tg-stream)
        # -------------------------------------------------------
        location /tg-stream/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_buffering off;
        }

        # -------------------------------------------------------
        # 5. OPEN WEBUI (/ - Root application & API)
        # -------------------------------------------------------
        location /api/ {
            proxy_pass http://127.0.0.1:8098/api/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /auth/ {
            proxy_pass http://127.0.0.1:8098/auth/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /_app/ {
            proxy_pass http://127.0.0.1:8098/_app/;
        }

        location /static/ {
            proxy_pass http://127.0.0.1:8098/static/;
        }

        location / {
            proxy_pass http://127.0.0.1:8098/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
