name: OpenCode Serve — Cloudflare Workers Tunnel

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'   # Auto-restart every 5 hours

jobs:
  serve:
    name: OpenCode Serve + TryCloudflare → Workers KV
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5.5 hours

    env:
      HF_TOKEN:                 ${{ secrets.HF_TOKEN }}
      OPENCODE_SERVER_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
      COPILOT_GITHUB_TOKEN:     ${{ secrets.COPILOT_GITHUB_TOKEN }}
      OPENROUTER_API_KEY:       ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
      CF_API_TOKEN:             ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID:            ${{ secrets.CF_ACCOUNT_ID }}
      CF_KV_NAMESPACE_ID:       ${{ secrets.CF_KV_NAMESPACE_ID }}
      XDG_DATA_HOME:            /data/share
      XDG_CONFIG_HOME:          /data/config
      XDG_CACHE_HOME:           /data/cache
      XDG_STATE_HOME:           /data/state

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Create Required Directories ───────────────────────────────────
      - name: Setup Directories
        run: |
          sudo mkdir -p /data/share/opencode /data/config/opencode \
                        /data/cache/opencode /data/state/opencode \
                        /data/logs /projects/default/memory/sessions
          sudo chmod -R 777 /data /projects
          git config --global --add safe.directory '*'

      # ── 3. Python Setup ───────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install --quiet "huggingface_hub>=0.23" python-dotenv requests

      # ── 4. Install OpenCode Binary ────────────────────────────────────────
      - name: Install OpenCode Serve
        run: |
          OPENCODE_VERSION="1.18.3"
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin opencode
          sudo chmod +x /usr/local/bin/opencode
          echo "[OK] $(opencode --version)"

      # ── 5. Install cloudflared ────────────────────────────────────────────
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          echo "[OK] $(cloudflared --version)"

      # ── 6. Restore Workspace from HF Dataset ─────────────────────────────
      - name: Restore Workspace from HF Dataset
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "[RESTORE] Pulling workspace from Jishnupg/OpenCode-Storage..."
            python3 sync_engine.py restore 2>&1 | tail -20 || true
          else
            echo "[RESTORE] HF_TOKEN not set — fresh start"
          fi

      # ── 7. Configure OpenCode ─────────────────────────────────────────────
      - name: Configure OpenCode
        run: |
          python3 - << 'PYEOF'
          import json, os
          p = "/data/config/opencode/opencode.json"
          try:
              d = json.load(open(p)) if os.path.exists(p) else {}
          except Exception:
              d = {}
          d["$schema"] = "https://opencode.ai/config.json"
          d["server"]  = {"port": 8080, "hostname": "127.0.0.1"}
          if not d.get("model"):
              d["model"] = "opencode/big-pickle"
          json.dump(d, open(p, "w"), indent=2)
          print("[CONFIG] Written:", json.dumps(d, indent=2))
          PYEOF

      # ── 8. Bootstrap Memory Templates ────────────────────────────────────
      - name: Bootstrap Memory
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          MEMORY_DIR = Path("/projects/default/memory")
          (MEMORY_DIR / "sessions").mkdir(parents=True, exist_ok=True)
          templates = {
            "GLOBAL.md":       "# Global Memory\n\n## User Preferences\n",
            "PROJECT.md":      "# Project Memory\n\n## Overview\n",
            "CONVENTIONS.md":  "# Coding Conventions\n\n## Naming\n",
            "TODO.md":         "# Pending Tasks\n\n## High Priority\n",
          }
          for name, content in templates.items():
              fp = MEMORY_DIR / name
              if not fp.exists():
                  fp.write_text(content)
                  print(f"[MEMORY] Created: {name}")
          print("[MEMORY] Bootstrap done")
          PYEOF

      # ── 9. Assemble Memory Context ────────────────────────────────────────
      - name: Assemble Memory Context
        run: python3 memory_updater.py once 2>&1 | tail -10 || true

      # ── 10. Start All Daemons ─────────────────────────────────────────────
      - name: Start Background Daemons
        run: |
          nohup python3 sync_engine.py watch    > /data/logs/sync.log    2>&1 &
          nohup python3 memory_updater.py watch > /data/logs/memory.log  2>&1 &
          nohup python3 session_watcher.py      > /data/logs/sessions.log 2>&1 &
          nohup python3 cleaner.py              > /data/logs/cleaner.log 2>&1 &
          echo "[DAEMONS] sync / memory / session / cleaner started"

      # ── 11. Start OpenCode Serve ──────────────────────────────────────────
      - name: Start OpenCode Serve
        run: |
          cd /projects/default
          nohup opencode serve --port 8080 --hostname 127.0.0.1 \
            > /data/logs/opencode.log 2>&1 &

          echo "[OPENCODE] Waiting for server to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080 > /dev/null 2>&1; then
              echo "[OPENCODE] ✅ Ready after ${i}s"
              break
            fi
            sleep 2
          done

      # ── 12. Start TryCloudflare Tunnel ────────────────────────────────────
      - name: Start TryCloudflare Tunnel
        run: |
          nohup cloudflared tunnel --url http://localhost:8080 \
            --no-autoupdate \
            --logfile /data/logs/tunnel.log 2>&1 &

          echo "[TUNNEL] Waiting for tunnel URL..."
          TUNNEL_URL=""
          for i in $(seq 1 40); do
            sleep 3
            TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9\-]+\.trycloudflare\.com' \
              /data/logs/tunnel.log 2>/dev/null | head -1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "[TUNNEL] ❌ Could not get tunnel URL"
            cat /data/logs/tunnel.log | tail -20
            exit 1
          fi

          # Save URL for next steps
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV

          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║  🌐 TUNNEL ACTIVE:                                   ║"
          echo "║  $TUNNEL_URL"
          echo "╚══════════════════════════════════════════════════════╝"

      # ── 13. Push Tunnel URL → Cloudflare KV ──────────────────────────────
      - name: Push URL to Cloudflare KV (Workers see fixed URL)
        run: |
          echo "[KV] Pushing tunnel URL to Cloudflare KV..."
          echo "[KV] URL: $TUNNEL_URL"

          RESPONSE=$(curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/current_url" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: text/plain" \
            --data "$TUNNEL_URL" 2>&1)

          echo "[KV] Cloudflare API response: $RESPONSE"

          # Also store start time
          curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/last_started" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: text/plain" \
            --data "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" || true

          echo "[KV] ✅ Workers proxy now routes to: $TUNNEL_URL"

      # ── 14. Push URL → HF Dataset (Android app fallback) ─────────────────
      - name: Push URL to HF Dataset
        run: |
          python3 - << PYEOF
          import os, time
          try:
              from huggingface_hub import HfApi
              import io
              token = os.environ.get("HF_TOKEN", "")
              url   = os.environ.get("TUNNEL_URL", "")
              if not token or not url:
                  print("[HF] Skipping — missing token or URL")
              else:
                  api = HfApi(token=token)
                  api.create_repo("Jishnupg/OpenCode-Storage", repo_type="dataset",
                                  private=True, exist_ok=True)
                  content = f"{url}\nstarted: {time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime())}\n"
                  api.upload_file(
                      repo_id="Jishnupg/OpenCode-Storage",
                      repo_type="dataset",
                      path_in_repo="server-url.txt",
                      path_or_fileobj=io.BytesIO(content.encode()),
                      commit_message="runner: update server URL",
                  )
                  print(f"[HF] ✅ server-url.txt updated: {url}")
          except Exception as e:
              print(f"[HF] Warning: {e}")
          PYEOF

      # ── 15. Summary ───────────────────────────────────────────────────────
      - name: Print Live Summary
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  ✅ OpenCode Serve is LIVE"
          echo "════════════════════════════════════════════════════════"
          echo "  🔗 Fixed Workers URL  : https://opencode-serve.jishnupg.workers.dev"
          echo "  🚇 Tunnel (temporary) : $TUNNEL_URL"
          echo "  📦 HF Dataset         : Jishnupg/OpenCode-Storage → server-url.txt"
          echo "  🧠 RAM available      : $(free -h | awk '/^Mem:/{print $2}')"
          echo "  ⏱  Will restart in    : ~5.5 hours"
          echo "════════════════════════════════════════════════════════"
          echo ""

          # Post to GitHub Step Summary
          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## 🚀 OpenCode Serve — LIVE

          | | |
          |---|---|
          | **Fixed URL** | https://opencode-serve.jishnupg.workers.dev |
          | **Tunnel URL** | $TUNNEL_URL |
          | **RAM** | $(free -h | awk '/^Mem:/{print $2}') |
          | **Started** | $(date -u '+%Y-%m-%d %H:%M UTC') |
          | **Restarts at** | $(date -u -d '+5 hours 30 minutes' '+%Y-%m-%d %H:%M UTC') |
          SUMMARY

      # ── 16. Keep Alive + Health Monitor ──────────────────────────────────
      - name: Keep Alive (5.5 hours)
        run: |
          END_TIME=$(($(date +%s) + 19800))   # 5.5 hours

          RESTART_COUNT=0
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 60

            # Health check opencode
            if ! curl -sf http://127.0.0.1:8080 > /dev/null 2>&1; then
              RESTART_COUNT=$((RESTART_COUNT + 1))
              echo "[MONITOR] ⚠️  OpenCode down — restarting (attempt $RESTART_COUNT)..."
              cd /projects/default
              nohup opencode serve --port 8080 --hostname 127.0.0.1 \
                >> /data/logs/opencode.log 2>&1 &
              sleep 10
            fi

            # Every 30 minutes — refresh KV TTL
            ELAPSED=$(( $(date +%s) % 1800 ))
            if [ "$ELAPSED" -lt 60 ]; then
              curl -sf -X PUT \
                "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/heartbeat" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: text/plain" \
                --data "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > /dev/null 2>&1 || true
            fi
          done

          echo "[MONITOR] 5.5 hours complete — preparing for restart"

      # ── 17. Final Sync Before Restart ────────────────────────────────────
      - name: Final Workspace Sync
        if: always()
        run: |
          echo "[SYNC] Final sync before restart..."
          python3 sync_engine.py sync 2>&1 | tail -5 || true

      # ── 18. Self-Restart ──────────────────────────────────────────────────
      - name: Trigger Self-Restart
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[RESTART] Triggering next run of cloudflare-tunnel.yml..."
          gh workflow run cloudflare-tunnel.yml \
            --repo JishnuPG-tech/OpenCode-Web \
            --ref main || echo "[RESTART] Warning: could not trigger restart"
          echo "[RESTART] ✅ Next run queued"
