name: CI & Code Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Scripts & Code Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax Check Python Scripts
        run: |
          python -m py_compile proxy.py tg_streamer.py gateway/*.py

      - name: Validate Shell Script Syntax
        run: |
          sudo apt-get update && sudo apt-get install -y shell-check || true
          bash -n entrypoint.sh

      - name: Validate Dockerfile Syntax
        run: |
          docker build --dry-run . || true
