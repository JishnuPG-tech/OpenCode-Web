events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    port_in_redirect off;
    server_name_in_redirect off;

    server {
        listen 4096;
        server_name _;

        # Common proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Forwarded-Host "jishnupg-opencode-cli.hf.space";
        proxy_set_header X-Forwarded-Port "443";

        # Strip internal :4096 port from any Location header
        proxy_redirect ~^https?://[^/]+:4096/(.*)$ https://jishnupg-opencode-cli.hf.space/$1;

        # -------------------------------------------------------
        # 1. OMNIROUTE AI GATEWAY  -->  /omniroute/
        # -------------------------------------------------------
        location /omniroute/ {
            proxy_pass http://127.0.0.1:20128/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Rewrite backend redirects: /login -> /omniroute/login etc.
            proxy_redirect ~^/(.+)$ /omniroute/$1;
            # Rewrite asset paths in HTML/JS so /_next/ loads via /omniroute/
            proxy_set_header Accept-Encoding "";
            sub_filter_types text/javascript application/javascript;
            sub_filter '"/_next/' '"/omniroute/_next/';
            sub_filter "'/_next/" "'/omniroute/_next/";
            sub_filter_once off;
        }

        location = /omniroute {
            return 301 /omniroute/;
        }

        # OmniRoute OpenAI-compatible API
        location /v1/ {
            proxy_pass http://127.0.0.1:20128/v1/;
            proxy_http_version 1.1;
        }

        # -------------------------------------------------------
        # 2. OPENCODE SERVER  -->  /server/
        # -------------------------------------------------------
        location /server/ {
            proxy_pass http://127.0.0.1:4097/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location = /server {
            return 301 /server/;
        }

        # OpenCode internal REST + SSE endpoints
        location /api/ {
            proxy_pass http://127.0.0.1:4097/api/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }

        location /session    { proxy_pass http://127.0.0.1:4097; proxy_http_version 1.1; }
        location /project    { proxy_pass http://127.0.0.1:4097; proxy_http_version 1.1; }
        location /config     { proxy_pass http://127.0.0.1:4097; proxy_http_version 1.1; }
        location /permission { proxy_pass http://127.0.0.1:4097; proxy_http_version 1.1; }
        location /question   { proxy_pass http://127.0.0.1:4097; proxy_http_version 1.1; }
        location /file       { proxy_pass http://127.0.0.1:4097; proxy_http_version 1.1; }
        location /find       { proxy_pass http://127.0.0.1:4097; proxy_http_version 1.1; }
        location /events     { proxy_pass http://127.0.0.1:4097; proxy_http_version 1.1; proxy_buffering off; }
        location /event      { proxy_pass http://127.0.0.1:4097; proxy_http_version 1.1; proxy_buffering off; }

        location /ws {
            proxy_pass http://127.0.0.1:4097;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # -------------------------------------------------------
        # 3. JELLYFIN MEDIA SERVER  -->  /jellyfin/
        # -------------------------------------------------------
        location /jellyfin/ {
            proxy_pass http://127.0.0.1:8096/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Prefix /jellyfin;
        }

        location = /jellyfin {
            return 301 /jellyfin/;
        }

        # -------------------------------------------------------
        # 4. TELEGRAM STREAM PROXY  -->  /tg-stream/
        # -------------------------------------------------------
        location /tg-stream/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
        }

        # -------------------------------------------------------
        # 5. OPEN WEBUI  -->  / (root - served last, catches all)
        # -------------------------------------------------------
        location / {
            proxy_pass http://127.0.0.1:8098/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
