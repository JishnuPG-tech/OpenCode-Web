name: OpenCode Serve — Pinggy.io Tunnel

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Custom Pinggy Subdomain Alias (e.g. opencode-jishnu)'
        required: false
        default: 'opencode-jishnu'
  schedule:
    - cron: '0 */5 * * *'   # Auto-restart every 5 hours

jobs:
  serve:
    name: OpenCode Serve + Pinggy Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5.5 hours

    env:
      HF_TOKEN:                 ${{ secrets.HF_TOKEN }}
      OPENCODE_SERVER_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
      COPILOT_GITHUB_TOKEN:     ${{ secrets.COPILOT_GITHUB_TOKEN }}
      OPENROUTER_API_KEY:       ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
      PINGGY_TOKEN:             ${{ secrets.PINGGY_TOKEN }}
      PINGGY_ALIAS:             ${{ github.event.inputs.alias || secrets.PINGGY_ALIAS || 'opencode-jishnu' }}
      XDG_DATA_HOME:            /data/share
      XDG_CONFIG_HOME:          /data/config
      XDG_CACHE_HOME:           /data/cache
      XDG_STATE_HOME:           /data/state

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Create Required Directories ───────────────────────────────────
      - name: Setup Directories
        run: |
          sudo mkdir -p /data/share/opencode /data/config/opencode \
                        /data/cache/opencode /data/state/opencode \
                        /data/logs /projects/default/memory/sessions
          sudo chmod -R 777 /data /projects
          git config --global --add safe.directory '*'

      # ── 3. Python Setup ───────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install --quiet "huggingface_hub>=0.23" python-dotenv requests

      # ── 4. Install OpenCode Binary ────────────────────────────────────────
      - name: Install OpenCode Serve
        run: |
          OPENCODE_VERSION="1.18.3"
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin opencode
          sudo chmod +x /usr/local/bin/opencode
          echo "[OK] $(opencode --version)"

      # ── 5. Restore Workspace from HF Dataset ─────────────────────────────
      - name: Restore Workspace from HF Dataset
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "[RESTORE] Pulling workspace from Jishnupg/OpenCode-Storage..."
            python3 sync_engine.py restore 2>&1 | tail -20 || true
          else
            echo "[RESTORE] HF_TOKEN not set — fresh start"
          fi

      # ── 6. Configure OpenCode ─────────────────────────────────────────────
      - name: Configure OpenCode
        run: |
          python3 - << 'PYEOF'
          import json, os
          p = "/data/config/opencode/opencode.json"
          try:
              d = json.load(open(p)) if os.path.exists(p) else {}
          except Exception:
              d = {}
          d["$schema"] = "https://opencode.ai/config.json"
          d["server"]  = {"port": 8080, "hostname": "127.0.0.1"}
          json.dump(d, open(p, "w"), indent=2)
          print("[CONFIG] Written:", json.dumps(d, indent=2))
          PYEOF

      # ── 7. Bootstrap Memory Templates ────────────────────────────────────
      - name: Bootstrap Memory
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          MEMORY_DIR = Path("/projects/default/memory")
          (MEMORY_DIR / "sessions").mkdir(parents=True, exist_ok=True)
          templates = {
            "GLOBAL.md":       "# Global Memory\n\n## User Preferences\n",
            "PROJECT.md":      "# Project Memory\n\n## Overview\n",
            "CONVENTIONS.md":  "# Coding Conventions\n\n## Naming\n",
            "TODO.md":         "# Pending Tasks\n\n## High Priority\n",
          }
          for name, content in templates.items():
              fp = MEMORY_DIR / name
              if not fp.exists():
                  fp.write_text(content)
                  print(f"[MEMORY] Created: {name}")
          print("[MEMORY] Bootstrap done")
          PYEOF

      # ── 8. Assemble Memory Context ────────────────────────────────────────
      - name: Assemble Memory Context
        run: python3 memory_updater.py once 2>&1 | tail -10 || true

      # ── 9. Start All Daemons ─────────────────────────────────────────────
      - name: Start Background Daemons
        run: |
          nohup python3 sync_engine.py watch    > /data/logs/sync.log    2>&1 &
          nohup python3 memory_updater.py watch > /data/logs/memory.log  2>&1 &
          nohup python3 session_watcher.py      > /data/logs/sessions.log 2>&1 &
          nohup python3 cleaner.py              > /data/logs/cleaner.log 2>&1 &
          echo "[DAEMONS] sync / memory / session / cleaner started"

      # ── 10. Start OpenCode Serve ──────────────────────────────────────────
      - name: Start OpenCode Serve
        run: |
          cd /projects/default
          nohup opencode serve --port 8080 --hostname 127.0.0.1 \
            > /data/logs/opencode.log 2>&1 &

          echo "[OPENCODE] Waiting for server to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080 > /dev/null 2>&1; then
              echo "[OPENCODE] ✅ Ready after ${i}s"
              break
            fi
            sleep 2
          done

      # ── 11. Start Pinggy.io Tunnel (Authenticated Token / Custom Alias) ───
      - name: Start Pinggy.io Tunnel
        run: |
          echo "[PINGGY] Connecting Pinggy.io tunnel..."
          mkdir -p ~/.ssh
          ssh-keyscan -p 443 a.pinggy.io >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_USER=""
          if [ -n "$PINGGY_TOKEN" ]; then
            SSH_USER="${PINGGY_TOKEN}@"
            echo "[PINGGY] Using authenticated Pinggy Access Token"
          else
            echo "[PINGGY] No PINGGY_TOKEN secret set — using free anonymous mode"
          fi

          # Launch Pinggy SSH tunnel with custom alias if token provided
          if [ -n "$PINGGY_TOKEN" ] && [ -n "$PINGGY_ALIAS" ]; then
            nohup ssh -p 443 \
                      -o StrictHostKeyChecking=no \
                      -o ServerAliveInterval=60 \
                      -o ServerAliveCountMax=3 \
                      -R ${PINGGY_ALIAS}:80:localhost:8080 \
                      ${SSH_USER}a.pinggy.io > /data/logs/pinggy.log 2>&1 &
          else
            nohup ssh -p 443 \
                      -o StrictHostKeyChecking=no \
                      -o ServerAliveInterval=60 \
                      -o ServerAliveCountMax=3 \
                      -R0:localhost:8080 \
                      ${SSH_USER}a.pinggy.io > /data/logs/pinggy.log 2>&1 &
          fi

          echo "[PINGGY] Waiting for HTTPS URL..."
          PINGGY_URL=""
          for i in $(seq 1 30); do
            sleep 2
            PINGGY_URL=$(grep -oP 'https://[a-zA-Z0-9\.\-]+\.pinggy[a-zA-Z0-9\.\-]*' \
              /data/logs/pinggy.log 2>/dev/null | head -1 || true)
            if [ -n "$PINGGY_URL" ]; then
              break
            fi
          done

          if [ -z "$PINGGY_URL" ]; then
            echo "[PINGGY] Check log output:"
            cat /data/logs/pinggy.log | head -30
            PINGGY_URL="https://${PINGGY_ALIAS}.pinggy.link"
          fi

          echo "PINGGY_URL=$PINGGY_URL" >> $GITHUB_ENV

          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║  🌐 PINGGY.IO TUNNEL ACTIVE:                         ║"
          echo "║  $PINGGY_URL"
          echo "╚══════════════════════════════════════════════════════╝"

      # ── 12. Push URL → HF Dataset ────────────────────────────────────────
      - name: Push URL to HF Dataset
        run: |
          python3 - << PYEOF
          import os, time
          try:
              from huggingface_hub import HfApi
              import io
              token = os.environ.get("HF_TOKEN", "")
              url   = os.environ.get("PINGGY_URL", "")
              if token and url:
                  api = HfApi(token=token)
                  api.create_repo("Jishnupg/OpenCode-Storage", repo_type="dataset", private=True, exist_ok=True)
                  content = f"{url}\nstarted: {time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime())}\n"
                  api.upload_file(
                      repo_id="Jishnupg/OpenCode-Storage",
                      repo_type="dataset",
                      path_in_repo="server-url.txt",
                      path_or_fileobj=io.BytesIO(content.encode()),
                      commit_message="runner: update pinggy URL",
                  )
                  print(f"[HF] ✅ server-url.txt updated: {url}")
          except Exception as e:
              print(f"[HF] Warning: {e}")
          PYEOF

      # ── 13. Summary ───────────────────────────────────────────────────────
      - name: Print Live Summary
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  ✅ OpenCode Serve is LIVE via Pinggy.io"
          echo "════════════════════════════════════════════════════════"
          echo "  🔗 Direct HTTPS URL  : $PINGGY_URL"
          echo "  📦 HF Dataset        : Jishnupg/OpenCode-Storage → server-url.txt"
          echo "  🧠 RAM available     : $(free -h | awk '/^Mem:/{print $2}')"
          echo "  ⏱  Will restart in   : ~5.5 hours"
          echo "════════════════════════════════════════════════════════"

          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## 🚀 OpenCode Serve (Pinggy Tunnel) — LIVE

          | Property | Value |
          |---|---|
          | **Direct HTTPS URL** | $PINGGY_URL |
          | **RAM** | $(free -h | awk '/^Mem:/{print $2}') |
          | **Started** | $(date -u '+%Y-%m-%d %H:%M UTC') |
          SUMMARY

      # ── 14. Keep Alive + Health Monitor ──────────────────────────────────
      - name: Keep Alive (5.5 hours)
        run: |
          END_TIME=$(($(date +%s) + 19800))   # 5.5 hours

          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 60

            # Check if OpenCode is responding locally
            if ! curl -sf http://127.0.0.1:8080 > /dev/null 2>&1; then
              echo "[MONITOR] ⚠️  OpenCode down — restarting..."
              cd /projects/default
              nohup opencode serve --port 8080 --hostname 127.0.0.1 >> /data/logs/opencode.log 2>&1 &
            fi

            # Check if Pinggy SSH tunnel is active
            if ! pgrep -f "a.pinggy.io" > /dev/null 2>&1; then
              echo "[MONITOR] ⚠️  Pinggy tunnel re-connecting..."
              SSH_USER=""
              if [ -n "$PINGGY_TOKEN" ]; then SSH_USER="${PINGGY_TOKEN}@"; fi
              if [ -n "$PINGGY_TOKEN" ] && [ -n "$PINGGY_ALIAS" ]; then
                nohup ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -R ${PINGGY_ALIAS}:80:localhost:8080 ${SSH_USER}a.pinggy.io >> /data/logs/pinggy.log 2>&1 &
              else
                nohup ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -R0:localhost:8080 ${SSH_USER}a.pinggy.io >> /data/logs/pinggy.log 2>&1 &
              fi
            fi
          done

          echo "[MONITOR] 5.5 hours complete — preparing for restart"

      # ── 15. Final Sync Before Restart ────────────────────────────────────
      - name: Final Workspace Sync
        if: always()
        run: |
          python3 sync_engine.py sync 2>&1 | tail -5 || true

      # ── 16. Trigger Self-Restart ──────────────────────────────────────────
      - name: Trigger Self-Restart
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pinggy.yml \
            --repo JishnuPG-tech/OpenCode-Web \
            --ref main || echo "[RESTART] Warning: could not trigger restart"
          echo "[RESTART] ✅ Next run queued"
