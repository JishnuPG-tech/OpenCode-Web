name: Heavy Build & Compilation Runner

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target (all, docker, mobile, python)'
        required: false
        default: 'all'
  push:
    branches: [ main ]

jobs:
  build-and-compile:
    name: Heavy Build & Artifact Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Build Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-dotenv huggingface_hub py_compile-plus

      - name: Validate Python Source Compilation
        run: |
          python -m py_compile opencode_serve_lite.py
          python -m py_compile sync_engine.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Build Mobile App Dependencies
        run: |
          if [ -d "mobile" ]; then
            cd mobile
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
            npm run typecheck || true
          fi

      - name: Build Docker Container Image
        run: |
          docker build -t opencode-serve-lite:latest -f Dockerfile.render .

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-serve-artifacts
          path: |
            opencode_serve_lite.py
            Dockerfile.render
            render.yaml
            README.md
