events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Disable adding internal port 4096 to redirects
    port_in_redirect off;
    server_name_in_redirect off;

    server {
        listen 4096;
        server_name _;

        # Explicit rewrite to strip port 4096 from any backend Location header
        proxy_redirect ~^https?://[^/]+:4096/(.*)$ /$1;
        proxy_redirect ~^http://(.*)$ https://$1;

        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host "jishnupg-opencode-cli.hf.space";
        proxy_set_header X-Forwarded-Host "jishnupg-opencode-cli.hf.space";
        proxy_set_header X-Forwarded-Port "443";
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ----------------------------------------------------
        # 1. OPEN WEBUI (/openwebui and /webui)
        # ----------------------------------------------------
        location /openwebui/ {
            proxy_pass http://127.0.0.1:8098/;
        }

        location = /openwebui {
            return 301 /openwebui/;
        }

        location /webui/ {
            proxy_pass http://127.0.0.1:8098/;
        }

        location = /webui {
            return 301 /webui/;
        }

        # ----------------------------------------------------
        # 2. OMNIROUTE GATEWAY (/omniroute, /dashboard, and /v1)
        # ----------------------------------------------------
        location /omniroute/ {
            proxy_pass http://127.0.0.1:20128/;
            proxy_redirect /dashboard /omniroute/dashboard;
            proxy_redirect ~^https?://[^/]+:4096/omniroute/(.*)$ /omniroute/$1;
            proxy_set_header Accept-Encoding "";
            sub_filter 'href="/' 'href="/omniroute/';
            sub_filter 'src="/' 'src="/omniroute/';
            sub_filter 'action="/' 'action="/omniroute/';
            sub_filter_once off;
        }

        location = /omniroute {
            return 301 /omniroute/;
        }

        location /omniroute/dashboard {
            proxy_pass http://127.0.0.1:20128/dashboard;
            proxy_set_header Accept-Encoding "";
            sub_filter 'href="/' 'href="/omniroute/';
            sub_filter 'src="/' 'src="/omniroute/';
            sub_filter 'action="/' 'action="/omniroute/';
            sub_filter_once off;
        }

        location /omniroute/assets/ {
            proxy_pass http://127.0.0.1:20128/assets/;
        }

        location /dashboard {
            proxy_pass http://127.0.0.1:20128/dashboard;
            proxy_set_header Accept-Encoding "";
            sub_filter 'href="/' 'href="/omniroute/';
            sub_filter 'src="/' 'src="/omniroute/';
            sub_filter_once off;
        }

        location /v1/ {
            proxy_pass http://127.0.0.1:20128/v1/;
        }

        # ----------------------------------------------------
        # 3. OPENCODE SERVER (/server, /session, /project, /ws)
        # ----------------------------------------------------
        location /server/ {
            proxy_pass http://127.0.0.1:4097/;
        }

        location = /server {
            return 301 /server/;
        }

        location /session {
            proxy_pass http://127.0.0.1:4097;
        }

        location /project {
            proxy_pass http://127.0.0.1:4097;
        }

        location /config {
            proxy_pass http://127.0.0.1:4097;
        }

        location /events {
            proxy_pass http://127.0.0.1:4097;
        }

        location /ws {
            proxy_pass http://127.0.0.1:4097;
        }

        # ----------------------------------------------------
        # 4. JELLYFIN MEDIA SERVER (/jellyfin and /Jellyfin)
        # ----------------------------------------------------
        location /jellyfin/ {
            proxy_pass http://127.0.0.1:8096/;
        }

        location = /jellyfin {
            return 301 /jellyfin/;
        }

        location /Jellyfin/ {
            proxy_pass http://127.0.0.1:8096/;
        }

        location = /Jellyfin {
            return 301 /Jellyfin/;
        }

        # ----------------------------------------------------
        # 5. TELEGRAM STREAM PROXY (/tg-stream)
        # ----------------------------------------------------
        location /tg-stream/ {
            proxy_pass http://127.0.0.1:8080/;
        }

        # ----------------------------------------------------
        # 6. DEFAULT ROOT ROUTE (Open WebUI at /)
        # ----------------------------------------------------
        location / {
            proxy_pass http://127.0.0.1:8098;
        }
    }
}
