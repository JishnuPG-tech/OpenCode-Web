name: OpenCode Serve — zrok.io Tunnel (Fixed Custom URL & Ultra Fast)

on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: 'Custom zrok reserved share name'
        required: false
        default: 'opencode-jishnu'
  schedule:
    - cron: '0 */5 * * *'   # Auto-restart every 5 hours

jobs:
  serve:
    name: OpenCode Serve + zrok.io Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5.5 hours

    env:
      HF_TOKEN:                 ${{ secrets.HF_TOKEN }}
      OPENCODE_SERVER_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
      COPILOT_GITHUB_TOKEN:     ${{ secrets.COPILOT_GITHUB_TOKEN }}
      OPENROUTER_API_KEY:       ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
      ZROK_TOKEN:               ${{ secrets.ZROK_TOKEN || 'W4zWGtzTAHnM' }}
      ZROK_SHARE_NAME:          ${{ github.event.inputs.subdomain || 'opencode-jishnu' }}
      XDG_DATA_HOME:            /data/share
      XDG_CONFIG_HOME:          /data/config
      XDG_CACHE_HOME:           /data/cache
      XDG_STATE_HOME:           /data/state

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Create Required Directories ───────────────────────────────────
      - name: Setup Directories
        run: |
          sudo mkdir -p /data/share/opencode /data/config/opencode \
                        /data/cache/opencode /data/state/opencode \
                        /data/logs /projects/default/memory/sessions
          sudo chmod -R 777 /data /projects
          git config --global --add safe.directory '*'

      # ── 3. Python Setup ───────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install --quiet "huggingface_hub>=0.23" python-dotenv requests

      # ── 4. Install OpenCode Binary ────────────────────────────────────────
      - name: Install OpenCode Serve
        run: |
          OPENCODE_VERSION="1.18.3"
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin opencode
          sudo chmod +x /usr/local/bin/opencode
          echo "[OK] $(opencode --version)"

      # ── 5. Install zrok Binary ────────────────────────────────────────────
      - name: Install zrok
        run: |
          ZROK_VERSION="0.4.42"
          curl -fsSL "https://github.com/openziti/zrok/releases/download/v${ZROK_VERSION}/zrok_${ZROK_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin zrok
          sudo chmod +x /usr/local/bin/zrok
          echo "[OK] $(zrok version)"

      # ── 6. Restore Workspace from HF Dataset ─────────────────────────────
      - name: Restore Workspace from HF Dataset
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "[RESTORE] Pulling workspace from Jishnupg/OpenCode-Storage..."
            python3 sync_engine.py restore 2>&1 | tail -20 || true
          else
            echo "[RESTORE] HF_TOKEN not set — fresh start"
          fi

      # ── 7. Configure OpenCode ─────────────────────────────────────────────
      - name: Configure OpenCode
        run: |
          python3 - << 'PYEOF'
          import json, os
          p = "/data/config/opencode/opencode.json"
          try:
              d = json.load(open(p)) if os.path.exists(p) else {}
          except Exception:
              d = {}
          d["$schema"] = "https://opencode.ai/config.json"
          d["server"]  = {"port": 8080, "hostname": "127.0.0.1"}
          json.dump(d, open(p, "w"), indent=2)
          print("[CONFIG] Written:", json.dumps(d, indent=2))
          PYEOF

      # ── 8. Bootstrap Memory Templates ────────────────────────────────────
      - name: Bootstrap Memory
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          MEMORY_DIR = Path("/projects/default/memory")
          (MEMORY_DIR / "sessions").mkdir(parents=True, exist_ok=True)
          templates = {
            "GLOBAL.md":       "# Global Memory\n\n## User Preferences\n",
            "PROJECT.md":      "# Project Memory\n\n## Overview\n",
            "CONVENTIONS.md":  "# Coding Conventions\n\n## Naming\n",
            "TODO.md":         "# Pending Tasks\n\n## High Priority\n",
          }
          for name, content in templates.items():
              fp = MEMORY_DIR / name
              if not fp.exists():
                  fp.write_text(content)
                  print(f"[MEMORY] Created: {name}")
          print("[MEMORY] Bootstrap done")
          PYEOF

      # ── 9. Assemble Memory Context ────────────────────────────────────────
      - name: Assemble Memory Context
        run: python3 memory_updater.py once 2>&1 | tail -10 || true

      # ── 10. Start All Daemons ─────────────────────────────────────────────
      - name: Start Background Daemons
        run: |
          nohup python3 sync_engine.py watch    > /data/logs/sync.log    2>&1 &
          nohup python3 memory_updater.py watch > /data/logs/memory.log  2>&1 &
          nohup python3 session_watcher.py      > /data/logs/sessions.log 2>&1 &
          nohup python3 cleaner.py              > /data/logs/cleaner.log 2>&1 &
          echo "[DAEMONS] sync / memory / session / cleaner started"

      # ── 11. Start OpenCode Serve ──────────────────────────────────────────
      - name: Start OpenCode Serve
        run: |
          cd /projects/default
          nohup opencode serve --port 8080 --hostname 127.0.0.1 \
            > /data/logs/opencode.log 2>&1 &

          echo "[OPENCODE] Waiting for server to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080 > /dev/null 2>&1; then
              echo "[OPENCODE] ✅ Ready after ${i}s"
              break
            fi
            sleep 2
          done

      # ── 12. Enable zrok & Reserve/Share Custom Subdomain ──────────────────
      - name: Enable zrok & Launch Tunnel
        run: |
          echo "[ZROK] Enabling environment with token..."
          zrok enable "${ZROK_TOKEN}" || true

          # Reserve share if not already reserved
          echo "[ZROK] Reserving public share name: ${ZROK_SHARE_NAME}..."
          zrok reserve public --name "${ZROK_SHARE_NAME}" http://127.0.0.1:8080 2>&1 | tee /data/logs/zrok_reserve.log || true

          # Launch zrok share
          echo "[ZROK] Launching zrok share..."
          nohup zrok share reserved "${ZROK_SHARE_NAME}" > /data/logs/zrok.log 2>&1 &
          
          # If reserved fails, fallback to direct public share
          sleep 5
          if ! pgrep -x "zrok" > /dev/null 2>&1; then
            echo "[ZROK] Fallback to direct public share..."
            nohup zrok share public http://127.0.0.1:8080 > /data/logs/zrok.log 2>&1 &
          fi

          echo "[ZROK] Waiting for active HTTPS URL..."
          ZROK_URL=""
          for i in $(seq 1 30); do
            sleep 2
            ZROK_URL=$(grep -oP 'https://[a-zA-Z0-9\.\-]+\.share\.zrok\.io' /data/logs/zrok.log /data/logs/zrok_reserve.log 2>/dev/null | head -1 || true)
            if [ -n "$ZROK_URL" ]; then
              break
            fi
          done

          if [ -z "$ZROK_URL" ]; then
            ZROK_URL="https://${ZROK_SHARE_NAME}.share.zrok.io"
          fi

          echo "ZROK_URL=$ZROK_URL" >> $GITHUB_ENV

          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║  🌐 ZROK.IO TUNNEL ACTIVE:                           ║"
          echo "║  $ZROK_URL"
          echo "╚══════════════════════════════════════════════════════╝"

      # ── 13. Push URL → HF Dataset ────────────────────────────────────────
      - name: Push URL to HF Dataset
        run: |
          python3 - << PYEOF
          import os, time
          try:
              from huggingface_hub import HfApi
              import io
              token = os.environ.get("HF_TOKEN", "")
              url   = os.environ.get("ZROK_URL", "")
              if token and url:
                  api = HfApi(token=token)
                  api.create_repo("Jishnupg/OpenCode-Storage", repo_type="dataset", private=True, exist_ok=True)
                  content = f"{url}\nstarted: {time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime())}\n"
                  api.upload_file(
                      repo_id="Jishnupg/OpenCode-Storage",
                      repo_type="dataset",
                      path_in_repo="server-url.txt",
                      path_or_fileobj=io.BytesIO(content.encode()),
                      commit_message="runner: update zrok URL",
                  )
                  print(f"[HF] ✅ server-url.txt updated: {url}")
          except Exception as e:
              print(f"[HF] Warning: {e}")
          PYEOF

      # ── 14. Summary ───────────────────────────────────────────────────────
      - name: Print Live Summary
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════"
          echo "  ✅ OpenCode Serve is LIVE via zrok.io"
          echo "════════════════════════════════════════════════════════"
          echo "  🔗 Fixed Custom URL  : $ZROK_URL"
          echo "  📦 HF Dataset        : Jishnupg/OpenCode-Storage → server-url.txt"
          echo "  🧠 RAM available     : $(free -h | awk '/^Mem:/{print $2}')"
          echo "  ⏱  Will restart in   : ~5.5 hours"
          echo "════════════════════════════════════════════════════════"

          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## 🚀 OpenCode Serve (zrok.io Tunnel) — LIVE

          | Property | Value |
          |---|---|
          | **Fixed Custom URL** | $ZROK_URL |
          | **RAM** | $(free -h | awk '/^Mem:/{print $2}') |
          | **Started** | $(date -u '+%Y-%m-%d %H:%M UTC') |
          SUMMARY

      # ── 15. Keep Alive & Health Monitor ──────────────────────────────────
      - name: Keep Alive (5.5 hours)
        run: |
          END_TIME=$(($(date +%s) + 19800))   # 5.5 hours

          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 30

            # Check if OpenCode is responding locally
            if ! curl -sf http://127.0.0.1:8080 > /dev/null 2>&1; then
              echo "[MONITOR] ⚠️  OpenCode down — restarting..."
              cd /projects/default
              nohup opencode serve --port 8080 --hostname 127.0.0.1 >> /data/logs/opencode.log 2>&1 &
            fi

            # Check if zrok share is active
            if ! pgrep -x "zrok" > /dev/null 2>&1; then
              echo "[MONITOR] ⚠️  zrok tunnel dropped — restarting..."
              nohup zrok share reserved "${ZROK_SHARE_NAME}" >> /data/logs/zrok.log 2>&1 &
            fi
          done

          echo "[MONITOR] 5.5 hours complete — preparing for restart"

      # ── 16. Final Sync Before Restart ────────────────────────────────────
      - name: Final Workspace Sync
        if: always()
        run: |
          python3 sync_engine.py sync 2>&1 | tail -5 || true

      # ── 17. Trigger Self-Restart ──────────────────────────────────────────
      - name: Trigger Self-Restart
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run zrok.yml \
            -f subdomain="${ZROK_SHARE_NAME}" \
            --repo JishnuPG-tech/OpenCode-Web \
            --ref main || echo "[RESTART] Warning: could not trigger restart"
          echo "[RESTART] ✅ Next run queued"
