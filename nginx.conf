events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 4096;

        # OmniRoute Dashboard UI
        location /dashboard {
            proxy_pass http://127.0.0.1:20128;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OmniRoute API & OpenAI-compatible routes
        location /v1/ {
            proxy_pass http://127.0.0.1:20128/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OmniRoute Static Assets
        location /assets/ {
            proxy_pass http://127.0.0.1:20128/assets/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # OmniRoute Health Check
        location = /health {
            proxy_pass http://127.0.0.1:20128/health;
            proxy_set_header Host $host;
        }

        # OpenCode Server & API (Default Route)
        location / {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
