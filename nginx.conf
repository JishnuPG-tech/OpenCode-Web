events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    port_in_redirect off;
    server_name_in_redirect off;

    server {
        listen 4096;
        server_name _;

        # Global Proxy Headers (Strip internal port 4096)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host "jishnupg-opencode-cli.hf.space";
        proxy_set_header X-Forwarded-Host "jishnupg-opencode-cli.hf.space";
        proxy_set_header X-Forwarded-Port "443";
        proxy_set_header X-Forwarded-Proto "https";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Strip :4096 from any location headers returned by any backend
        proxy_redirect ~^https?://[^/]+:4096/(.*)$ https://jishnupg-opencode-cli.hf.space/$1;
        proxy_redirect ~^http://jishnupg-opencode-cli\.hf\.space/(.*)$ https://jishnupg-opencode-cli.hf.space/$1;

        # ----------------------------------------------------
        # 1. OPEN WEBUI (/openwebui and /webui)
        # ----------------------------------------------------
        location /openwebui/ {
            proxy_pass http://127.0.0.1:8098/openwebui/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /openwebui;
        }

        location = /openwebui {
            return 301 /openwebui/;
        }

        location /webui/ {
            proxy_pass http://127.0.0.1:8098/openwebui/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location = /webui {
            return 301 /openwebui/;
        }

        # ----------------------------------------------------
        # 2. OMNIROUTE GATEWAY (/omniroute, /v1, /_next)
        # ----------------------------------------------------
        location /omniroute/ {
            proxy_pass http://127.0.0.1:20128/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect /login /omniroute/login;
            proxy_redirect /dashboard /omniroute/dashboard;
            proxy_set_header Accept-Encoding "";
            sub_filter_types text/javascript application/javascript application/json;
            sub_filter 'href="/' 'href="/omniroute/';
            sub_filter 'src="/' 'src="/omniroute/';
            sub_filter 'action="/' 'action="/omniroute/';
            sub_filter '="/_next/' '="/omniroute/_next/';
            sub_filter '"/_next/' '"/omniroute/_next/';
            sub_filter_once off;
        }

        location = /omniroute {
            return 301 /omniroute/;
        }

        location /_next/ {
            proxy_pass http://127.0.0.1:20128/_next/;
            proxy_http_version 1.1;
        }

        location /v1/ {
            proxy_pass http://127.0.0.1:20128/v1/;
            proxy_http_version 1.1;
        }

        # ----------------------------------------------------
        # 3. OPENCODE SERVER (/server, /api, /session, /project, /config, etc.)
        # ----------------------------------------------------
        location /server/ {
            proxy_pass http://127.0.0.1:4097/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location = /server {
            return 301 /server/;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:4097/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /session {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /project {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
        }

        location /config {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
        }

        location /permission {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
        }

        location /question {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
        }

        location /file {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
        }

        location /find {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
        }

        location /events {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
        }

        location /event {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
        }

        location /ws {
            proxy_pass http://127.0.0.1:4097;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ----------------------------------------------------
        # 4. JELLYFIN MEDIA SERVER (/jellyfin and /Jellyfin)
        # ----------------------------------------------------
        location /jellyfin/ {
            proxy_pass http://127.0.0.1:8096/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /jellyfin;
        }

        location = /jellyfin {
            return 301 /jellyfin/;
        }

        location /Jellyfin/ {
            proxy_pass http://127.0.0.1:8096/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location = /Jellyfin {
            return 301 /jellyfin/;
        }

        # ----------------------------------------------------
        # 5. TELEGRAM STREAM PROXY (/tg-stream)
        # ----------------------------------------------------
        location /tg-stream/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_http_version 1.1;
            proxy_buffering off;
        }

        # ----------------------------------------------------
        # 6. ROOT LANDING HUB (/ - Serves index.html)
        # ----------------------------------------------------
        location / {
            root /;
            try_files /index.html =404;
        }
    }
}
